# アプリの検査。lint、型の検査、依存の向きの検査（dependency-cruiser）、単体試験（vitest）を流す。
# 秘匿値の検査は harness-secrets.yml が、文書の検査と検査の試験は harness-docs.yml が受け持つ（このファイルには足さない）。
# マージの必須条件にする設定は、GitHub のリポジトリの設定（ブランチの保護）で行う。アクションはコミットの SHA で固定し、
# 版の名前をコメントに残す。Node.js の版は、検証の基準の .nvmrc から読む。
name: app-checks

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  app-checks:
    # ブランチやタグを消した push では、検査する中身が無い
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # 依存のキャッシュを使わない。package.json に packageManager の欄を後で足しても、ほかのブランチが書いた
          # キャッシュを読まないため。
          package-manager-cache: false
      # 依存のインストール用のスクリプト（preinstall など）を動かさずに入れる
      - name: install（インストール用のスクリプトを動かさない）
        run: npm ci --ignore-scripts
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: check:deps（依存の向き）
        run: npm run check:deps
      - name: test（単体試験）
        run: npm run test
