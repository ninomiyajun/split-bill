# ハーネスの秘匿値の検査。作業ツリーの全ファイルと、変更の範囲の各コミットの中身を調べる。マージの必須条件にする設定は、
# GitHub のリポジトリの設定（ブランチの保護）で行う。アクションはコミットの SHA で固定し、版の名前をコメントに残す。
# 秘匿値の検査は、依存のインストール用のスクリプトと、リポジトリ由来のほかのスクリプトより先に動かす。
name: harness-secrets

# push は、すべてのブランチとタグで動かす（公開リポジトリでは、push した時点で中身が公開されるため）。
on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  check-secrets:
    # ブランチやタグを消した push では、検査する中身が無い
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 変更の範囲の各コミットを検査するため、履歴をすべて取得する
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # 依存のインストール用のスクリプト（preinstall など）を動かさずに入れる。秘匿値の検査より前に、
      # 変更されたリポジトリ由来のスクリプトが作業ツリーを書き換えられないようにするため。
      - name: install（インストール用のスクリプトを動かさない）
        run: npm ci --ignore-scripts
      # 秘匿値の検査は npm run を経由せず node で直接呼ぶ。変更で package.json に pre で始まるスクリプトを足して、
      # 検査の前に動かすことを防ぐため。
      - name: check-secrets（作業ツリーの全ファイル）
        run: node scripts/harness/check-secrets.mjs
      # 変更の範囲の起点は、GitHub が渡すイベントの中身（GITHUB_EVENT_PATH の JSON）から読む
      - name: check-secrets（変更の範囲の各コミットの中身）
        run: |
          base="$(node -e 'const e = require(process.env.GITHUB_EVENT_PATH); const pr = e.pull_request; process.stdout.write(String((pr && pr.base && pr.base.sha) || e.before || ""))')"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # HEAD は、pull request を base に合わせた試しのマージのコミット
            node scripts/harness/check-secrets.mjs --commits "$base..HEAD"
          elif [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>&1; then
            node scripts/harness/check-secrets.mjs --commits "$base..HEAD"
          else
            # 新しいブランチやタグの最初の push（前の先頭が 0 になる）や、前のコミットが履歴に無い場合は、
            # すべてのコミットを調べる
            node scripts/harness/check-secrets.mjs --commits HEAD
          fi
