# Dependabot の版の更新。Dockerfile の土台のイメージ（タグとダイジェストで固定）の更新を取り込むため
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node のメジャーの版は .nvmrc と一緒に人が上げる（土台のイメージだけが先に上がり、版が食い違うのを防ぐ）
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
